<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulangan Harian Ekonomi – Ketenagakerjaan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#f1f0ff;--card:#fff;--ink:#241e4e;--mute:#6a6591;--line:#dcd9f5;--pri:#4b3fd1;--pri2:#7a5cff;--teal:#0fb5a4;--sun:#ffc533;--cor:#ff5d7a;--ok:#16a870;--okbg:#d9f7ea;--bad:#e5385a;--badbg:#ffe3e9;--ragu:#ffb020;--none:#e6e4f7;--onpri:#fff;--hero1:#3a2fb8;--hero2:#7a3fe0;--hero3:#ff5d7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122e;--card:#1f1b44;--ink:#efedff;--mute:#a9a5d6;--line:#363066;--pri:#8f84ff;--pri2:#a58bff;--okbg:#0f3b30;--badbg:#44182a;--none:#322d63;--onpri:#15122e;--hero1:#2a2190;--hero2:#5a2fb0;--hero3:#c93a63}}
:root[data-theme="dark"]{--bg:#15122e;--card:#1f1b44;--ink:#efedff;--mute:#a9a5d6;--line:#363066;--pri:#8f84ff;--pri2:#a58bff;--okbg:#0f3b30;--badbg:#44182a;--none:#322d63;--onpri:#15122e;--hero1:#2a2190;--hero2:#5a2fb0;--hero3:#c93a63}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Baloo 2",Nunito,system-ui,sans-serif;line-height:1.15;margin:0}
button,input{font:inherit;color:inherit}
.wrap{width:100%;max-width:980px;margin:0 auto;padding:16px}
main{flex:1}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2) 60%,var(--hero3));color:#fff;border-radius:24px;padding:34px 28px;margin-top:8px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:var(--sun);opacity:.9}
.hero:before{content:"";position:absolute;right:70px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:var(--teal);opacity:.85}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(28px,6vw,46px);font-weight:800;max-width:560px}
.hero p{margin:10px 0 0;max-width:520px;opacity:.95}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.form{margin-top:16px;display:grid;gap:14px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;cursor:pointer;background:var(--pri);color:var(--onpri);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.big{font-size:18px;padding:14px 26px;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.btn.ragu{background:var(--ragu);color:#2b1d00}
.btn.ragu.on{background:#2b1d00;color:var(--ragu)}
.btn.ghost{background:var(--none);color:var(--ink)}
.btn.fin{background:var(--cor);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pri);color:var(--onpri);border-radius:16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
:root[data-theme="dark"] .bar,:root:not([data-theme="light"]) .bar{color:var(--onpri)}
.bar .who{font-weight:700;font-size:14px}
.timer{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:24px;background:rgba(255,255,255,.22);border-radius:12px;padding:0 14px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--cor);color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.timer.low{animation:none}}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px;margin-top:14px;align-items:start}
.qno{display:inline-block;background:var(--sun);color:#2b1d00;font-weight:800;border-radius:10px;padding:2px 12px;margin-bottom:10px}
.ctx{margin:0 0 8px}
.qt{font-weight:700;margin:12px 0}
table{border-collapse:collapse;margin:8px 0;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--none)}
.tw{overflow-x:auto}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:8px;cursor:pointer}
.opt:hover{border-color:var(--pri2)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--none);display:grid;place-items:center;font-weight:800}
.opt.sel{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--card))}
.opt.sel .l{background:var(--teal);color:#fff}
.nav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .btn{flex:1;min-width:110px}
.side h3{font-size:18px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.n{aspect-ratio:1;border-radius:10px;border:2px solid transparent;background:var(--none);color:var(--ink);font-weight:800;cursor:pointer}
.n.a{background:var(--ok);color:#fff}
.n.r{background:var(--ragu);color:#2b1d00}
.n.c{border-color:var(--ink);box-shadow:0 0 0 2px var(--sun)}
.leg{display:grid;gap:4px;margin:12px 0;font-size:13px;color:var(--mute)}
.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.score{text-align:center;background:linear-gradient(135deg,var(--hero1),var(--hero2) 65%,var(--hero3));color:#fff;border-radius:24px;padding:28px 18px}
.score .big{font-family:"Baloo 2",sans-serif;font-size:84px;font-weight:800;line-height:1}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.info div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.info small{color:var(--mute);display:block}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.st{flex:1;min-width:100px;border-radius:14px;padding:10px;text-align:center;font-weight:800}
.rv{margin-top:14px;border-left:8px solid var(--line)}
.rv.ok{border-left-color:var(--ok)}.rv.no{border-left-color:var(--bad)}.rv.kos{border-left-color:var(--ragu)}
.tag{display:inline-block;border-radius:8px;padding:1px 10px;font-weight:800;font-size:13px;margin-right:6px}
.exp{background:var(--bg);border-radius:12px;padding:10px 14px;margin-top:10px}
.ro{padding:6px 12px;border-radius:10px;margin-top:6px;border:1px solid var(--line)}
.ro.k{background:var(--okbg);border-color:var(--ok)}.ro.w{background:var(--badbg);border-color:var(--bad)}
footer{text-align:center;padding:18px 16px;color:var(--mute);font-size:14px;border-top:1px solid var(--line);margin-top:20px}
footer b{color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,15,50,.6);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{max-width:420px;width:100%}
.hide{display:none!important}
@media (max-width:760px){.layout{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}.grid{grid-template-columns:repeat(8,1fr)}.info{grid-template-columns:1fr}}
@media print{.bar,.nav,.noprint{display:none!important}}
</style>
</head>
<body>

<script>
var Q=[{"ctx": ["Dalam survei ketenagakerjaan di Desa Sukamaju, petugas mencatat lima warga berikut: Rina (17 tahun, siswi SMA); Bu Tuti (45 tahun, ibu rumah tangga yang tidak sedang mencari pekerjaan); Pak Darto (68 tahun, pensiunan yang tidak bekerja); Andi (24 tahun, sarjana yang aktif melamar kerja ke berbagai perusahaan); dan Wati (30 tahun, penjual sayur yang berdagang setiap hari)."], "q": "Berdasarkan data tersebut, warga yang termasuk angkatan kerja adalah ....", "o": ["Rina dan Wati", "Bu Tuti dan Andi", "Andi dan Wati", "Pak Darto dan Andi", "Rina, Bu Tuti, dan Pak Darto"], "k": 2, "lv": "Sedang", "e": "Angkatan kerja adalah penduduk usia kerja yang bekerja atau mencari pekerjaan. Wati bekerja dan Andi mencari pekerjaan. Rina (sekolah), Bu Tuti (mengurus rumah tangga), dan Pak Darto (pensiunan) termasuk bukan angkatan kerja."}, {"ctx": ["Seorang siswa menyatakan, “Semua penduduk usia kerja otomatis termasuk angkatan kerja.”"], "q": "Pernyataan tersebut kurang tepat karena ....", "o": ["sebagian penduduk usia kerja berstatus bukan angkatan kerja, misalnya pelajar, ibu rumah tangga, dan pensiunan", "penduduk usia kerja hanya mencakup mereka yang sudah memiliki pekerjaan", "angkatan kerja hanya terdiri atas penduduk yang berusia di atas 64 tahun", "pengangguran tidak termasuk penduduk usia kerja", "bukan angkatan kerja hanya terdiri atas anak-anak di bawah 15 tahun"], "k": 0, "lv": "Sedang", "e": "Penduduk usia kerja (tenaga kerja) terbagi menjadi angkatan kerja (bekerja dan pengangguran) dan bukan angkatan kerja (sekolah, mengurus rumah tangga, lainnya). Jadi angkatan kerja hanya sebagian dari penduduk usia kerja."}, {"ctx": ["Pak Budi (35 tahun) memiliki sebuah warung makan. Selama dua minggu terakhir warungnya tutup karena direnovasi, tetapi ia tetap akan membukanya kembali setelah renovasi selesai."], "q": "Menurut konsep ketenagakerjaan, status Pak Budi adalah ....", "o": ["pengangguran terbuka, karena dua minggu terakhir tidak bekerja", "bukan angkatan kerja, karena warungnya tidak beroperasi", "setengah menganggur, karena jam kerjanya kurang dari 35 jam seminggu", "pengangguran terselubung, karena tenaganya tidak dimanfaatkan penuh", "bekerja, karena memiliki usaha dan hanya sementara tidak bekerja"], "k": 4, "lv": "Sedang", "e": "Orang yang memiliki pekerjaan atau usaha tetapi sementara tidak bekerja (renovasi, cuti, sakit) tetap dikategorikan bekerja, sehingga termasuk angkatan kerja."}, {"ctx": ["Sebuah kawasan industri di Kota Cilegon menyediakan 5.000 lapangan kerja dan seluruhnya telah terisi oleh pekerja. Namun, di wilayah tersebut masih terdapat 1.500 pencari kerja yang belum tertampung."], "q": "Berdasarkan ilustrasi tersebut, pernyataan yang benar mengenai kesempatan kerja adalah ....", "o": ["Kesempatan kerja sebanyak 6.500 orang karena mencakup pencari kerja", "Kesempatan kerja sebanyak 5.000 orang, sedangkan 1.500 pencari kerja merupakan pengangguran yang belum tertampung", "Kesempatan kerja sebanyak 1.500 orang sesuai jumlah pencari kerja", "Kesempatan kerja tidak ada karena masih terdapat pengangguran", "Kesempatan kerja hanya dihitung dari lowongan yang belum terisi"], "k": 1, "lv": "Sedang", "e": "Kesempatan kerja adalah banyaknya lapangan kerja yang tersedia dan telah diisi oleh pekerja, yaitu 5.000 orang. Pencari kerja yang belum tertampung (1.500 orang) termasuk pengangguran, bukan bagian dari kesempatan kerja."}, {"ctx": ["Pemerintah daerah menurunkan suku bunga kredit usaha dan menyederhanakan perizinan investasi sehingga banyak perusahaan baru berdiri di daerah tersebut."], "q": "Dampak yang paling mungkin terhadap ketenagakerjaan di daerah itu adalah ....", "o": ["angkatan kerja berkurang karena usaha mandiri tidak lagi diminati", "bukan angkatan kerja menurun karena jumlah penduduk usia kerja berkurang", "pengangguran struktural meningkat karena investasi menekan permintaan tenaga kerja", "investasi meningkat sehingga lapangan kerja bertambah dan kesempatan kerja semakin luas", "upah riil pasti turun karena permintaan tenaga kerja menurun"], "k": 3, "lv": "Sedang", "e": "Bunga kredit rendah dan perizinan yang mudah mendorong investasi dan berdirinya usaha baru, sehingga permintaan tenaga kerja naik dan kesempatan kerja bertambah."}, {"ctx": ["Tiga orang pekerja: Pak Joko (tukang las yang memperoleh sertifikat keahlian dari kursus di balai latihan kerja), Bu Lina (sarjana akuntansi yang bekerja sebagai auditor), dan Pak Sarno (buruh angkut tanpa pendidikan atau pelatihan khusus)."], "q": "Penggolongan tenaga kerja berdasarkan kualitasnya yang tepat adalah ....", "o": ["Pak Joko terdidik; Bu Lina terlatih; Pak Sarno tidak terdidik dan tidak terlatih", "Pak Joko tidak terlatih; Bu Lina terdidik; Pak Sarno terlatih", "Pak Joko terlatih; Bu Lina terdidik; Pak Sarno tidak terdidik dan tidak terlatih", "Pak Joko terlatih; Bu Lina terlatih; Pak Sarno terdidik", "Pak Joko terdidik; Bu Lina terdidik; Pak Sarno terlatih"], "k": 2, "lv": "Sedang", "e": "Pak Joko terlatih (keahlian dari kursus bersertifikat), Bu Lina terdidik (pendidikan formal tinggi), dan Pak Sarno tidak terdidik dan tidak terlatih."}, {"ctx": ["Sinta (26 tahun) sudah delapan bulan mencari pekerjaan tanpa hasil. Kini ia berhenti melamar karena merasa tidak ada lowongan yang cocok, tetapi ia masih bersedia bekerja jika ada tawaran."], "q": "Menurut konsep BPS, status Sinta adalah ....", "o": ["bukan angkatan kerja, karena sudah berhenti mencari pekerjaan", "angkatan kerja berstatus pengangguran terbuka (putus asa), karena masih bersedia bekerja", "bekerja, karena memiliki kesiapan untuk bekerja", "setengah pengangguran, karena jam kerjanya kurang", "bukan tenaga kerja, karena tidak aktif melamar pekerjaan"], "k": 1, "lv": "Sulit", "e": "Sinta masih bersedia bekerja walaupun berhenti mencari karena putus asa. Menurut BPS, kelompok ini tetap pengangguran terbuka sehingga termasuk angkatan kerja."}, {"ctx": ["Di suatu kota, jumlah penduduk usia kerja relatif tetap. Dalam beberapa tahun terakhir, jumlah penduduk yang bersekolah dan mengurus rumah tangga bertambah, sedangkan jumlah pekerja tidak berubah."], "q": "Dampak yang paling tepat terhadap kondisi ketenagakerjaan kota tersebut adalah ....", "o": ["angkatan kerja bertambah sehingga TPAK naik", "TPAK naik karena penduduk usia kerja tetap", "jumlah pengangguran terbuka pasti bertambah", "penduduk usia kerja berkurang karena jumlah pelajar naik", "bukan angkatan kerja bertambah sehingga angkatan kerja dan TPAK menurun"], "k": 4, "lv": "Sulit", "e": "Jika penduduk usia kerja tetap dan bukan angkatan kerja bertambah, maka angkatan kerja (PUK − BAK) berkurang sehingga TPAK menurun."}, {"ctx": ["Satu rumah tangga terdiri atas lima anggota: kakek (70 tahun), ayah (42 tahun), ibu (40 tahun), kakak (17 tahun), dan adik (13 tahun)."], "q": "Jika batas usia kerja menurut BPS adalah 15 tahun ke atas, jumlah anggota rumah tangga yang termasuk tenaga kerja (penduduk usia kerja) adalah ....", "o": ["4 orang", "5 orang", "3 orang", "2 orang", "1 orang"], "k": 0, "lv": "Sedang", "e": "Usia 15 tahun ke atas: kakek (70), ayah (42), ibu (40), dan kakak (17) = 4 orang. Adik (13 tahun) belum termasuk penduduk usia kerja."}, {"ctx": ["Perhatikan pernyataan berikut tentang status seseorang dalam ketenagakerjaan (berdasarkan konsep BPS):", {"p": "(1) Mahasiswa yang menerima upah dari pekerjaan paruh waktu 10 jam seminggu termasuk angkatan kerja."}, {"p": "(2) Pensiunan guru yang membuka usaha kecil dan aktif beroperasi termasuk bukan angkatan kerja."}, {"p": "(3) Ibu yang membantu usaha suaminya tanpa dibayar selama 12 jam seminggu termasuk bekerja."}, {"p": "(4) Orang yang sudah memperoleh pekerjaan tetapi belum mulai bekerja termasuk pengangguran terbuka."}], "q": "Pernyataan yang benar ditunjukkan oleh nomor ....", "o": ["(1) dan (2)", "(2) dan (3)", "(1), (2), dan (4)", "(1), (3), dan (4)", "(2), (3), dan (4)"], "k": 3, "lv": "Sulit", "e": "(1) benar: bekerja dengan upah, walaupun paruh waktu, termasuk bekerja. (2) salah: pensiunan yang aktif berusaha termasuk bekerja, jadi angkatan kerja. (3) benar: pekerja keluarga tak dibayar yang bekerja minimal 1 jam seminggu dihitung bekerja. (4) benar: menurut definisi BPS, orang yang sudah punya pekerjaan tetapi belum mulai bekerja dikelompokkan sebagai pengangguran terbuka."}, {"ctx": ["Gaji Pak Hasan naik dari Rp4.000.000 menjadi Rp4.400.000 (naik 10%). Pada tahun yang sama, inflasi mencapai 12%."], "q": "Pernyataan yang paling tepat mengenai kondisi upah Pak Hasan adalah ....", "o": ["upah riil naik karena upah nominal naik", "upah nominal naik, tetapi upah riil turun sehingga daya belinya menurun", "upah nominal dan upah riil sama-sama turun", "upah riil tidak berubah karena inflasi tidak memengaruhi upah", "upah nominal turun, tetapi upah riil naik"], "k": 1, "lv": "Sedang", "e": "Kenaikan upah nominal 10% lebih kecil daripada inflasi 12%, sehingga upah riil (daya beli) menurun."}, {"ctx": ["Upah nominal seorang karyawan sebesar Rp3.600.000 per bulan. Indeks Harga Konsumen (IHK) pada tahun tersebut adalah 120 dengan tahun dasar 100."], "q": "Besar upah riil karyawan tersebut adalah ....", "o": ["Rp4.320.000", "Rp3.600.000", "Rp3.240.000", "Rp3.000.000", "Rp2.400.000"], "k": 3, "lv": "Sedang", "e": "Upah riil = upah nominal : IHK × 100 = 3.600.000 : 120 × 100 = Rp3.000.000."}, {"ctx": ["Pak Anto diminta membangun pagar rumah milik Bu Rina. Keduanya sepakat bahwa Pak Anto menerima Rp15.000.000 untuk seluruh pekerjaan hingga selesai, berapa pun lamanya hari kerja dan jumlah pekerja yang dibutuhkan."], "q": "Sistem pengupahan yang diterapkan adalah ....", "o": ["upah borongan", "upah menurut waktu", "upah potongan (satuan hasil)", "upah premi", "upah indeks biaya hidup"], "k": 0, "lv": "Sedang", "e": "Upah ditetapkan untuk seluruh pekerjaan tanpa memandang lamanya waktu atau jumlah satuan hasil, itulah upah borongan."}, {"ctx": ["Seorang buruh konveksi dibayar Rp8.000 untuk setiap potong kemeja yang diselesaikan. Dalam satu bulan, ia menyelesaikan 450 potong."], "q": "Sistem upah yang diterapkan dan besar upah yang diterima buruh adalah ....", "o": ["sistem upah waktu, Rp3.600.000", "sistem upah borongan, Rp3.600.000", "sistem upah potongan, Rp3.600.000", "sistem upah potongan, Rp3.200.000", "sistem upah premi, Rp3.200.000"], "k": 2, "lv": "Sedang", "e": "Upah dihitung per satuan hasil: 450 × Rp8.000 = Rp3.600.000, sehingga sistem upah potongan (hasil)."}, {"ctx": ["Pemerintah provinsi menetapkan upah minimum provinsi (UMP) pada tingkat yang lebih tinggi daripada upah keseimbangan di pasar tenaga kerja."], "q": "Dampak yang paling mungkin terjadi, jika faktor lain dianggap tetap, adalah ....", "o": ["penawaran tenaga kerja turun sehingga pengangguran berkurang", "permintaan tenaga kerja naik karena upah lebih tinggi", "kesempatan kerja pasti meningkat karena daya beli pekerja naik", "upah keseimbangan turun otomatis menyesuaikan UMP", "biaya tenaga kerja naik sehingga perusahaan mengurangi permintaan tenaga kerja dan pengangguran berpotensi bertambah"], "k": 4, "lv": "Sulit", "e": "UMP di atas upah keseimbangan menaikkan biaya tenaga kerja. Permintaan tenaga kerja turun, sedangkan penawaran bertambah, sehingga muncul kelebihan penawaran tenaga kerja (pengangguran)."}, {"ctx": ["Seorang operator di PT Sinar Jaya menerima gaji pokok Rp3.000.000 per bulan. Perusahaan memberi tambahan Rp250.000 untuk setiap kelebihan produksi 100 unit di atas target 2.000 unit per bulan. Pada bulan ini, ia memproduksi 2.600 unit."], "q": "Sistem upah yang diterapkan dan total upah yang diterima operator bulan ini adalah ....", "o": ["sistem upah waktu, Rp3.000.000", "sistem upah premi, Rp4.500.000", "sistem upah premi, Rp9.500.000", "sistem upah borongan, Rp4.500.000", "sistem upah potongan, Rp3.250.000"], "k": 1, "lv": "Sulit", "e": "Kelebihan produksi = 2.600 − 2.000 = 600 unit = 6 kelipatan 100 unit. Premi = 6 × Rp250.000 = Rp1.500.000. Total = Rp3.000.000 + Rp1.500.000 = Rp4.500.000. Tambahan upah karena melampaui target disebut upah premi."}, {"ctx": ["Perhatikan pernyataan tentang kebijakan pengupahan di Indonesia berikut:", {"p": "(1) Upah minimum provinsi ditetapkan oleh gubernur dengan mempertimbangkan rekomendasi dewan pengupahan."}, {"p": "(2) Pengusaha dilarang membayar upah lebih rendah daripada upah minimum yang berlaku."}, {"p": "(3) Upah minimum berlaku untuk semua pekerja tanpa memandang masa kerja."}, {"p": "(4) Upah minimum berfungsi sebagai jaring pengaman agar pekerja tidak menerima upah di bawah batas kelayakan."}], "q": "Pernyataan yang benar ditunjukkan oleh nomor ....", "o": ["(1) dan (3)", "(2) dan (3)", "(1), (2), dan (4)", "(1), (3), dan (4)", "(2), (3), dan (4)"], "k": 2, "lv": "Sulit", "e": "(3) salah: upah minimum berlaku bagi pekerja dengan masa kerja kurang dari satu tahun. Pekerja yang telah bekerja satu tahun atau lebih menerima upah yang mengacu pada struktur dan skala upah perusahaan."}, {"ctx": ["Sebuah perusahaan menerapkan sistem upah indeks biaya hidup, yaitu upah pokok disesuaikan dengan perubahan Indeks Harga Konsumen (IHK). Upah pokok seorang pegawai Rp4.000.000 dan IHK naik 5% dibanding tahun lalu."], "q": "Upah pegawai setelah penyesuaian adalah ....", "o": ["Rp4.200.000", "Rp4.050.000", "Rp4.500.000", "Rp4.800.000", "Rp4.020.000"], "k": 0, "lv": "Sedang", "e": "Upah baru = Rp4.000.000 × (1 + 5%) = Rp4.200.000."}, {"ctx": ["Perhatikan tiga kasus pengangguran berikut:", {"p": "(1) Dewi mengundurkan diri dari perusahaan lama untuk mencari pekerjaan dengan gaji lebih baik, tetapi dua bulan belum mendapat pekerjaan baru."}, {"p": "(2) Pak Rudi, nelayan tradisional, tidak melaut selama tiga bulan karena cuaca buruk."}, {"p": "(3) Para pekerja pabrik meubel diberhentikan karena pekerjaan mereka digantikan mesin otomatis."}], "q": "Secara berurutan, jenis pengangguran pada kasus (1), (2), dan (3) adalah ....", "o": ["struktural, musiman, dan friksional", "friksional, siklikal, dan teknologi", "musiman, friksional, dan struktural", "friksional, musiman, dan teknologi", "siklikal, musiman, dan teknologi"], "k": 3, "lv": "Sulit", "e": "(1) friksional: berpindah kerja dan masih mencari. (2) musiman: terhenti pada waktu tertentu karena cuaca atau musim. (3) teknologi: tenaga manusia digantikan mesin."}, {"ctx": ["Industri kerajinan rotan di suatu kota menurun drastis karena perubahan selera pasar. Para perajin kehilangan pekerjaan dan tidak memiliki keterampilan untuk bekerja di bidang usaha lain yang sedang berkembang."], "q": "Jenis pengangguran yang terjadi dan upaya pemerintah yang paling tepat adalah ....", "o": ["pengangguran musiman; memberikan bantuan sosial setiap musim panen", "pengangguran friksional; menyediakan informasi lowongan kerja secara terbuka", "pengangguran siklikal; menerapkan kebijakan fiskal ekspansif", "pengangguran teknologi; melarang penggunaan mesin otomatis di industri", "pengangguran struktural; menyelenggarakan pelatihan alih keterampilan (reskilling)"], "k": 4, "lv": "Sedang", "e": "Perajin menganggur karena perubahan struktur permintaan dan keterampilan yang tidak sesuai: pengangguran struktural. Solusinya adalah pelatihan alih keterampilan."}, {"ctx": ["Akibat krisis ekonomi global, permintaan barang dan jasa menurun tajam. Banyak perusahaan mengurangi produksi dan memberhentikan pekerja."], "q": "Jenis pengangguran yang terjadi dan upaya pemerintah yang paling tepat adalah ....", "o": ["pengangguran siklikal; menaikkan suku bunga dan pajak agar inflasi turun", "pengangguran siklikal; kebijakan fiskal ekspansif untuk mendorong permintaan agregat", "pengangguran struktural; memperbanyak pelatihan di balai latihan kerja", "pengangguran friksional; menyediakan portal informasi lowongan kerja", "pengangguran musiman; memberikan pelatihan keterampilan di luar musim"], "k": 1, "lv": "Sedang", "e": "Turunnya permintaan agregat menimbulkan pengangguran siklikal. Kebijakan fiskal ekspansif (menambah belanja pemerintah, insentif pajak) mendorong permintaan dan membuka lapangan kerja."}, {"ctx": ["Sebidang sawah seluas satu hektare dikerjakan oleh delapan orang, padahal kebutuhan tenaga kerjanya sebenarnya cukup tiga orang."], "q": "Kondisi tersebut menunjukkan jenis pengangguran dan dampaknya, yaitu ....", "o": ["pengangguran terselubung; tambahan tenaga kerja tidak menambah hasil produksi secara berarti", "pengangguran terbuka; tenaga kerja sama sekali tidak memiliki pekerjaan", "pengangguran musiman; produksi hanya terhenti pada masa tertentu", "setengah pengangguran; jam kerja kurang dari 35 jam tetapi hasil produksi maksimal", "pengangguran siklikal; permintaan hasil pertanian menurun"], "k": 0, "lv": "Sedang", "e": "Lima orang berlebih dan produktivitas marginalnya hampir nol, tetapi mereka tetap tercatat bekerja: pengangguran terselubung."}, {"ctx": ["Pemerintah menjalankan tiga program berikut:", {"p": "(1) Portal informasi lowongan kerja yang mempertemukan pencari kerja dengan perusahaan."}, {"p": "(2) Pelatihan alih keterampilan bagi pekerja industri yang bidangnya menyusut."}, {"p": "(3) Program padat karya di desa saat petani menganggur di antara masa tanam dan panen."}], "q": "Secara berurutan, program (1), (2), dan (3) ditujukan untuk mengatasi pengangguran ....", "o": ["struktural, friksional, dan musiman", "musiman, struktural, dan friksional", "friksional, struktural, dan musiman", "friksional, musiman, dan struktural", "siklikal, struktural, dan musiman"], "k": 2, "lv": "Sulit", "e": "(1) portal lowongan mengatasi masalah informasi: friksional. (2) alih keterampilan mengatasi ketidaksesuaian keahlian: struktural. (3) padat karya mengisi jeda masa tanam: musiman."}, {"ctx": ["Perhatikan dampak-dampak berikut:", {"p": "(1) Produk domestik bruto aktual berada di bawah potensialnya."}, {"p": "(2) Angka kemiskinan meningkat."}, {"p": "(3) Kerawanan sosial dan kriminalitas meningkat."}, {"p": "(4) Penerimaan pajak pemerintah menurun."}, {"p": "(5) Daya beli masyarakat meningkat."}], "q": "Dampak pengangguran yang tinggi dan berkepanjangan  "(1) Pengangguran terbuka adalah penduduk yang tidak bekerja dan aktif mencari pekerjaan."}, {"p": "(2) Pengangguran terselubung terjadi ketika jumlah pekerja melebihi kebutuhan produksi."}, {"p": "(3) Setengah pengangguran bekerja kurang dari 35 jam seminggu dan masih mencari atau bersedia menerima pekerjaan tambahan."}, {"p": "(4) Pengangguran musiman terjadi akibat resesi ekonomi."}], "q": "Pernyataan yang benar ditunjukkan oleh nomor ....", "o": ["(1) dan (4)", "(2), (3), dan (4)", "(1), (2), dan (3)", "(1), (3), dan (4)", "(1), (2), (3), dan (4)"], "k": 2, "lv": "Sulit", "e": "(4) salah: pengangguran musiman disebabkan pola musim (misalnya jeda masa tanam), sedangkan resesi ekonomi menimbulkan pengangguran siklikal."}, {"ctx": ["Data ketenagakerjaan Kota Samudra: penduduk usia kerja 1.500.000 orang; bekerja 930.000 orang; mencari pekerjaan 70.000 orang; bersekolah 250.000 orang; mengurus rumah tangga 200.000 orang; dan lainnya 50.000 orang."], "q": "Tingkat Partisipasi Angkatan Kerja (TPAK) dan Tingkat Pengangguran Terbuka (TPT) kota tersebut adalah ....", "o": ["TPAK 66,67% dan TPT 7,00%", "TPAK 62,00% dan TPT 7,00%", "TPAK 66,67% dan TPT 7,53%", "TPAK 66,67% dan TPT 4,67%", "TPAK 70,00% dan TPT 7,00%"], "k": 0, "lv": "Sedang", "e": "AK = 930.000 + 70.000 = 1.000.000. TPAK = 1.000.000 : 1.500.000 × 100% = 66,67%. TPT = 70.000 : 1.000.000 × 100% = 7,00%."}, {"ctx": ["Sebuah kabupaten memiliki penduduk usia kerja 2.400.000 orang dan bukan angkatan kerja 720.000 orang. TPT kabupaten tersebut 8%."], "q": "Jumlah penduduk yang bekerja adalah ....", "o": ["134.400 orang", "1.344.000 orang", "1.488.000 orang", "1.545.600 orang", "1.680.000 orang"], "k": 3, "lv": "Sedang", "e": "AK = 2.400.000 − 720.000 = 1.680.000. Pengangguran = 8% × 1.680.000 = 134.400. Bekerja = 1.680.000 − 134.400 = 1.545.600."}, {"ctx": ["Provinsi Lestari memiliki penduduk usia kerja 800.000 orang. TPAK provinsi tersebut 72% dan TPT-nya 5%."], "q": "Jumlah penduduk yang bekerja dan jumlah pengangguran terbuka di provinsi tersebut adalah ....", "o": ["bekerja 536.000 orang dan pengangguran 40.000 orang", "bekerja 547.200 orang dan pengangguran 28.800 orang", "bekerja 576.000 orang dan pengangguran 28.800 orang", "bekerja 547.200 orang dan pengangguran 224.000 orang", "bekerja 518.400 orang dan pengangguran 57.600 orang"], "k": 1, "lv": "Sulit", "e": "AK = 72% × 800.000 = 576.000. Pengangguran = 5% × 576.000 = 28.800. Bekerja = 576.000 − 28.800 = 547.200."}, {"ctx": ["Data ketenagakerjaan Kota Harapan Jaya:", {"table": [["Tahun", "Penduduk Usia Kerja", "Bekerja", "Pengangguran Terbuka"], ["2024", "1.000.000", "600.000", "50.000"], ["2025", "1.040.000", "650.000", "52.000"]]}], "q": "Perubahan TPAK dan TPT kota tersebut dari tahun 2024 ke tahun 2025 adalah ....", "o": ["TPAK naik dari 60,00% menjadi 62,50% dan TPT turun dari 7,69% menjadi 7,41%", "TPAK tetap 65,00% dan TPT naik dari 7,69% menjadi 8,00%", "TPAK naik dari 65,00% menjadi 67,50% dan TPT naik dari 7,69% menjadi 8,00%", "TPAK naik dari 65,00% menjadi 67,50% dan TPT tetap 7,69%", "TPAK naik dari 65,00% menjadi 67,50% dan TPT turun dari 7,69% menjadi 7,41%"], "k": 4, "lv": "Sulit", "e": "2024: AK = 650.000; TPAK = 650.000 : 1.000.000 = 65,00%; TPT = 50.000 : 650.000 = 7,69%. 2025: AK = 702.000; TPAK = 702.000 : 1.040.000 = 67,50%; TPT = 52.000 : 702.000 = 7,41%."}, {"ctx": ["Sebuah kota memiliki angkatan kerja 1.250.000 orang, di antaranya 100.000 orang termasuk pengangguran terbuka. Tingkat Kesempatan Kerja (TKK) adalah persentase angkatan kerja yang bekerja terhadap seluruh angkatan kerja."], "q": "Besar Tingkat Kesempatan Kerja (TKK) kota tersebut adalah ....", "o": ["8,00%", "91,30%", "92,00%", "90,00%", "80,00%"], "k": 2, "lv": "Sedang", "e": "Bekerja = 1.250.000 − 100.000 = 1.150.000. TKK = 1.150.000 : 1.250.000 × 100% = 92,00% (sama dengan 100% − TPT 8,00%)."}, {"ctx": ["Kota Bahari memiliki penduduk usia kerja 600.000 orang, dengan 330.000 orang bekerja dan 30.000 orang mencari pekerjaan; sisanya bukan angkatan kerja. Pemerintah membuka kawasan industri baru yang menyediakan 20.000 lapangan kerja, dan seluruhnya diisi oleh para pencari kerja di kota tersebut."], "q": "Setelah kawasan industri beroperasi, TPAK dan TPT kota tersebut adalah ....", "o": ["TPAK 60,00% dan TPT 2,78%", "TPAK 60,00% dan TPT 8,33%", "TPAK 63,33% dan TPT 2,78%", "TPAK 60,00% dan TPT 2,86%", "TPAK 63,33% dan TPT 5,26%"], "k": 0, "lv": "Sulit", "e": "Sebelum: AK = 360.000 (TPAK 60%). Setelah: bekerja 350.000, pengangguran 10.000, AK tetap 360.000 karena lowongan diisi oleh pencari kerja. TPAK = 360.000 : 600.000 = 60,00%; TPT = 10.000 : 360.000 = 2,78%."}, {"ctx": ["Di suatu provinsi, jumlah penduduk bukan angkatan kerja 420.000 orang dan TPAK 65%."], "q": "Jumlah penduduk usia kerja dan angkatan kerja provinsi tersebut adalah ....", "o": ["penduduk usia kerja 1.080.000 orang dan angkatan kerja 660.000 orang", "penduduk usia kerja 1.200.000 orang dan angkatan kerja 420.000 orang", "penduduk usia kerja 1.400.000 orang dan angkatan kerja 980.000 orang", "penduduk usia kerja 1.200.000 orang dan angkatan kerja 780.000 orang", "penduduk usia kerja 1.800.000 orang dan angkatan kerja 1.380.000 orang"], "k": 3, "lv": "Sedang", "e": "BAK = 100% − 65% = 35% dari PUK. PUK = 420.000 : 0,35 = 1.200.000. AK = 65% × 1.200.000 = 780.000."}, {"ctx": ["Kabupaten Sentosa memiliki penduduk usia kerja 2.000.000 orang dan bukan angkatan kerja 650.000 orang. TPT kabupaten tersebut 6%."], "q": "TPAK dan jumlah penduduk yang bekerja di kabupaten tersebut adalah ....", "o": ["TPAK 67,50% dan bekerja 1.350.000 orang", "TPAK 67,50% dan bekerja 1.269.000 orang", "TPAK 67,50% dan bekerja 1.880.000 orang", "TPAK 32,50% dan bekerja 1.269.000 orang", "TPAK 67,50% dan bekerja 81.000 orang"], "k": 1, "lv": "Sulit", "e": "AK = 2.000.000 − 650.000 = 1.350.000; TPAK = 1.350.000 : 2.000.000 = 67,50%. Pengangguran = 6% × 1.350.000 = 81.000. Bekerja = 1.350.000 − 81.000 = 1.269.000."}, {"ctx": ["Data ketenagakerjaan Kota in mendapat pekerjaan)", "12.000"], ["Sudah memiliki pekerjaan tetapi belum mulai bekerja", "5.000"], ["Bersekolah", "150.000"], ["Mengurus rumah tangga", "100.000"], ["Lainnya", "10.000"]]}], "q": "TPAK dan TPT kota tersebut adalah ....", "o": ["TPAK 71,11% dan TPT 8,59%", "TPAK 68,33% dan TPT 4,88%", "TPAK 70,56% dan TPT 7,87%", "TPAK 71,11% dan TPT 9,40%", "TPAK 65,00% dan TPT 8,59%"], "k": 0, "lv": "Sulit", "e": "Pengangguran terbuka = mencari pekerjaan 30.000 + mempersiapkan usaha 8.000 + putus asa 12.000 + sudah punya pekerjaan tetapi belum mulai 5.000 = 55.000. AK = 585.000 + 55.000 = 640.000. TPAK = 640.000 : 900.000 = 71,11%. TPT = 55.000 : 640.000 = 8,59%."}, {"ctx": ["Kota Pesisir memiliki angkatan kerja 1.200.000 orang dengan 90.000 orang pengangguran terbuka. Pemerintah menargetkan TPT turun menjadi 5%. Jumlah angkatan kerja dianggap tetap dan seluruh lapangan kerja baru diisi oleh para penganggur."], "q": "Jumlah lapangan kerja baru yang harus tersedia untuk mencapai target adalah ....", "o": ["60.000 lapangan kerja", "45.000 lapangan kerja", "85.500 lapangan kerja", "30.000 lapangan kerja", "90.000 lapangan kerja"], "k": 3, "lv": "Sedang", "e": "Pengangguran target = 5% × 1.200.000 = 60.000. Lapangan kerja baru = 90.000 − 60.000 = 30.000."}, {"ctx": ["Dua kota memiliki data ketenagakerjaan berikut:", {"table": [["Kota", "Penduduk Usia Kerja", "Angkatan Kerja", "TPT"], ["Kota P", "1.000.000", "800.000", "10%"], ["Kota Q", "800.000", "600.000", "5%"]]}], "q": "Pernyataan yang benar mengenai kedua kota tersebut adalah ....", "o": ["Kota Q memiliki TPAK lebih tinggi karena TPT-nya lebih rendah", "Kota P memiliki TPAK lebih tinggi daripada Kota Q (80% berbanding 75%), tetapi jumlah penganggurnya lebih banyak (80.000 berbanding 30.000 orang)", "Jumlah penduduk yang bekerja di Kota Q lebih banyak karena TPT-nya lebih rendah", "TPAK kedua kota sama karena sama-sama di atas 70%", "Jumlah penduduk bukan angkatan kerja di Kota Q lebih banyak daripada Kota P"], "k": 1, "lv": "Sulit", "e": "Kota P: TPAK = 80%; pengangguran = 10% × 800.000 = 80.000; bekerja = 720.000; BAK = 200.000. Kota Q: TPAK = 75%; pengangguran = 5% × 600.000 = 30.000; bekerja = 570.000; BAK = 200.000. BAK kedua kota sama, dan TPAK tidak ditentukan oleh TPT."}];
var TOTAL=Q.length, DUR=120*60, KEY="uh-ekonomi-naker-v1";
var S={step:"start",name:"",kelas:"",absen:"",i:0,ans:{},ragu:{},end:0,left:DUR};
var tick=null, app=document.getElementById("app");
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.step==="quiz"&&o.end>Date.now()){S=o;return}}}catch(e){}}
function clr(){try{localStorage.removeItem(KEY)}catch(e){}}
function mmss(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function ctxHtml(q){return q.ctx.map(function(c){
  if(typeof c==="string")return '<p class="ctx">'+esc(c)+'</p>';
  if(c.p)return '<p class="ctx">'+esc(c.p)+'</p>';
  var t=c.table,h='<div class="tw"><table><tr>'+t[0].map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+'</tr>';
  for(var r=1;r<t.length;r++)h+='<tr>'+t[r].map(function(x){return '<td>'+esc(x)+'</td>'}).join("")+'</tr>';
  return h+'</table></div>'}).join("")}
function startView(){
  app.innerHTML='<section class="hero"><h1>Ulangan Harian Ekonomi</h1><h2 style="font-size:clamp(20px,4vw,28px);margin-top:6px">Materi Ketenagakerjaan</h2><p>Kelas XI (Fase F) · SMA Negeri 2 Kalianda. Isi data dirimu, lalu pilih satu jawaban paling tepat untuk setiap soal.</p><div class="chips"><span class="chip">'+TOTAL+' soal pilihan ganda</span><span class="chip">Waktu 120 menit</span><span class="chip">Pilihan A–E</span></div></section>'+
  '<section class="card form" style="margin-top:16px"><h3>Data siswa</h3><div class="row3"><div><label for="nm">Nama siswa</label><input id="nm" autocomplete="off" placeholder="Nama lengkap"></div><div><label for="kl">Kelas</label><input id="kl" autocomplete="off" placeholder="Contoh: XI-1"></div><div><label for="ab">Nomor absen</label><input id="ab" inputmode="numeric" placeholder="Contoh: 12"></div></div><div class="err" id="er"></div><button class="btn big" id="go">Mulai ulangan</button><p style="margin:0;color:var(--mute);font-size:14px">Timer mulai berjalan setelah kamu menekan tombol ini. Saat waktu habis, jawaban dikumpulkan otomatis.</p></section>';
  document.getElementById("go").onclick=function(){
    var n=document.getElementById("nm").value.trim(),k=document.getElementById("kl").value.trim(),a=document.getElementById("ab").value.trim();
    if(!n||!k||!a){document.getElementById("er").textContent="Lengkapi nama, kelas, dan nomor absen terlebih dahulu.";return}
    S={step:"quiz",name:n,kelas:k,absen:a,i:0,ans:{},ragu:{},end:Date.now()+DUR*1000,left:DUR};save();quizView()}}
function quizView(){
  clearInterval(tick);
  app.innerHTML='<div class="bar"><div class="who" id="who"></div><div class="timer" id="tm"></div></div><div class="layout"><section class="card" id="qc"></section><aside class="card side"><h3>Navigasi soal</h3><div class="grid" id="gr"></div><div class="leg"><span><i style="background:var(--ok)"></i>Sudah dijawab</span><span><i style="background:var(--ragu)"></i>Ragu-ragu</span><span><i style="background:var(--none)"></i>Belum dijawab</span></div><div id="cnt" style="font-size:14px;color:var(--mute)"></div><button class="btn fin" id="fn" style="width:100%;margin-top:12px">Selesai &amp; kumpulkan</button></aside></div>';
  document.getElementById("who").textContent=S.name+" · Kelas "+S.kelas+" · Absen "+S.absen;
  document.getElementById("fn").onclick=confirmFinish;
  renderQ();
  function t(){S.left=Math.round((S.end-Date.now())/1000);var el=document.getElementById("tm");if(!el)return;el.textContent=mmss(S.left);el.className="timer"+(S.left<=600?" low":"");if(S.left<=0){clearInterval(tick);finish()}}
  t();tick=setInterval(t,1000)}
function renderQ(){
  var q=Q[S.i],n=S.i+1,sel=S.ans[S.i],last=S.i===TOTAL-1,L="ABCDE";
  var h='<span class="qno">Soal '+n+' dari '+TOTAL+'</span>'+ctxHtml(q)+'<p class="qt">'+esc(q.q)+'</p>';
  q.o.forEach(function(o,j){h+='<button class="opt'+(sel===j?" sel":"")+'" data-j="'+j+'"><span class="l">'+L[j]+'</span><span>'+esc(o)+'</span></button>'});
  h+='<div class="nav"><button class="btn ghost" id="pv"'+(S.i===0?" disabled":"")+'>Sebelumnya</button><button class="btn ragu'+(S.ragu[S.i]?" on":"")+'" id="rg">'+(S.ragu[S.i]?"Batal ragu-ragu":"Ragu-ragu")+'</button><button class="btn" id="nx">'+(last?"Tinjau &amp; selesai":"Selanjutnya")+'</button></div>';
  var qc=document.getElementById("qc");qc.innerHTML=h;
  qc.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){var j=+b.dataset.j;if(S.ans[S.i]===j)delete S.ans[S.i];else S.ans[S.i]=j;save();renderQ()}});
  document.getElementById("pv").onclick=function(){go(S.i-1)};
  document.getElementById("nx").onclick=function(){last?confirmFinish():go(S.i+1)};
  document.getElementById("rg").onclick=function(){if(S.ragu[S.i])delete S.ragu[S.i];else S.ragu[S.i]=1;save();renderQ()};
  var g="",a=0,r=0;
  for(var k=0;k<TOTAL;k++){var c="n";if(S.ragu[k]){c+=" r";r++}else if(S.ans[k]!==undefined){c+=" a"}if(S.ans[k]!==undefined&&S.ragu[k]===undefined)a++;if(k===S.i)c+=" c";g+='<button class="'+c+'" data-k="'+k+'" aria-label="Soal '+(k+1)+'">'+(k+1)+'</button>'}
  var gr=document.getElementById("gr");gr.innerHTML=g;gr.querySelectorAll(".n").forEach(function(b){b.onclick=function(){go(+b.dataset.k)}});
  var done=Object.keys(S.ans).length;
  document.getElementById("cnt").textContent="Terjawab "+done+" dari "+TOTAL+" · Ragu-ragu "+Object.keys(S.ragu).length}
function go(i){S.i=i;save();renderQ();window.scrollTo({top:0})}
function confirmFinish(){
  var done=Object.keys(S.ans).length,rg=Object.keys(S.ragu).length,m=document.createElement("div");m.className="modal";
  m.innerHTML='<div class="card"><h3>Kumpulkan jawaban?</h3><p>Terjawab <b>'+done+'</b> dari '+TOTAL+' soal. Belum dijawab <b>'+(TOTAL-done)+'</b>. Ragu-ragu <b>'+rg+'</b>.</p><p style="color:var(--mute)">Setelah dikumpulkan, jawaban tidak dapat diubah.</p><div class="nav"><button class="btn ghost" id="bk">Kembali mengerjakan</button><button class="btn fin" id="ok">Ya, kumpulkan</button></div></div>';
  document.body.appendChild(m);
  m.querySelector("#bk").onclick=function(){m.remove()};
  m.querySelector("#ok").onclick=function(){m.remove();finish()}}
function finish(){
  clearInterval(tick);
  var ben=0,sal=0,kos=0;
  Q.forEach(function(q,i){if(S.ans[i]===undefined)kos++;else if(S.ans[i]===q.k)ben++;else sal++});
  S.step="result";S.res={ben:ben,sal:sal,kos:kos,nilai:Math.round(ben/TOTAL*1000)/10};clr();resultView()}
function resultView(){
  var R=S.res,L="ABCDE",nl=String(R.nilai).replace(".",",");
  var h='<section class="score" style="margin-top:8px"><div>Nilai akhir</div><div class="big">'+nl+'</div><div>Ulangan Harian Ekonomi · Materi Ketenagakerjaan</div></section>'+
  '<div class="info"><div><small>Nama</small><b>'+esc(S.name)+'</b></div><div><small>Kelas</small><b>'+esc(S.kelas)+'</b></div><div><small>Nomor absen</small><b>'+esc(S.absen)+'</b></div></div>'+
  '<div class="stats"><div class="st" style="background:var(--okbg)">Benar<br>'+R.ben+'</div><div class="st" style="background:var(--badbg)">Salah<br>'+R.sal+'</div><div class="st" style="background:var(--none)">Kosong<br>'+R.kos+'</div></div>'+
  '<div class="nav noprint"><button class="btn" onclick="window.print()">Cetak hasil</button><button class="btn ghost" id="ulang">Kembali ke awal</button></div><h2 style="margin-top:22px">Pembahasan soal</h2>';
  Q.forEach(function(q,i){
    var u=S.ans[i],st=u===undefined?"kos":(u===q.k?"ok":"no"),lab={ok:"Benar",no:"Salah",kos:"Tidak dijawab"}[st];
    var col={ok:"background:var(--okbg)",no:"background:var(--badbg)",kos:"background:var(--none)"}[st];
    h+='<article class="card rv '+st+'"><span class="tag" style="'+col+'">Soal '+(i+1)+' · '+lab+'</span><span class="tag" style="background:var(--none)">'+esc(q.lv)+'</span>'+ctxHtml(q)+'<p class="qt">'+esc(q.q)+'</p>';
    q.o.forEach(function(o,j){var c=j===q.k?" k":(j===u?" w":"");h+='<div class="ro'+c+'"><b>'+L[j]+'.</b> '+esc(o)+(j===q.k?' <b>✓ kunci</b>':'')+(j===u&&j!==q.k?' <b>✗ jawabanmu</b>':'')+(j===u&&j===q.k?' <b>(jawabanmu)</b>':'')+'</div>'});
    h+='<div class="exp"><b>Pembahasan:</b> '+esc(q.e)+'</div></article>'});
  app.innerHTML=h;window.scrollTo({top:0});
  document.getElementById("ulang").onclick=function(){S={step:"start",name:"",kelas:"",absen:"",i:0,ans:{},ragu:{},end:0,left:DUR};startView();window.scrollTo({top:0})}}
load();
if(S.step==="quiz")quizView();else startView();
</script>
